{{- /* templates/ingress-tcp-agents.yaml */}}
{{- if .Values.wazuh.ingress.tcp.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh.fullname" . }}-tcp-services
data:
  {{- range $port, $service := .Values.wazuh.ingress.tcp.ports }}
  {{ $port }}: "{{ $.Release.Namespace }}/{{ tpl $service $ }}:{{ $port }}"
  {{- end }}
{{- end }}
