{{- /* templates/ingress-api.yaml */}}
{{- if .Values.wazuh.ingress.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wazuh.fullname" . }}-services
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "wazuh.fullname" . }}-services
  annotations:
    {{- toYaml .Values.wazuh.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.wazuh.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.wazuh.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ tpl . $ | quote }}
        {{- end }}
      {{- with .secretName }}
      secretName: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.wazuh.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wazuh.fullname" . }}
                port:
                  number: {{ .Values.wazuh.master.service.ports.api }}
{{- end }}
